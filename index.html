<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Gửi yêu thương đến người anh yêu">
  <meta name="theme-color" content="#200817">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gửi Yêu Thương</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
</head>
<body>

  <!-- Stars Background -->
  <canvas id="stars-canvas"></canvas>

  <!-- Fireworks Canvas -->
  <canvas id="fireworks-canvas"></canvas>

  <!-- Falling Hearts & Messages -->
  <div id="hearts-container"></div>

  <!-- Center 3D Wireframe Rotating Neon Heart -->
  <div class="center-heart-wrapper" id="center-heart" role="button" aria-label="Khung trái tim 3D phát sáng">
    <div class="neon-aura"></div>
    <canvas id="heart-3d-canvas" class="heart-3d-canvas"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
