<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Gửi yêu thương đến người anh yêu">
  <meta name="theme-color" content="#200817">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gửi Yêu Thương</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
</head>
<body>

  <!-- Stars Background -->
  <canvas id="stars-canvas"></canvas>

  <!-- Fireworks Canvas -->
  <canvas id="fireworks-canvas"></canvas>

  <!-- Falling Hearts & Messages -->
  <div id="hearts-container"></div>

  <!-- Center 360° Rotating Neon Heart -->
  <div class="center-heart-wrapper" id="center-heart" role="button" aria-label="Trái tim tình yêu">
    <div class="neon-aura"></div>
    <div class="neon-heart-core">
      <!-- Heart Front Layer -->
      <svg class="heart-layer front" viewBox="0 0 24 24">
        <defs>
          <linearGradient id="neonPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff66b2" />
            <stop offset="35%" stop-color="#ff1493" />
            <stop offset="70%" stop-color="#ff007f" />
            <stop offset="100%" stop-color="#c70062" />
          </linearGradient>
        </defs>
        <path fill="url(#neonPinkGrad)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <!-- Heart Back Layer for 3D depth -->
      <svg class="heart-layer back" viewBox="0 0 24 24">
        <path fill="url(#neonPinkGrad)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
