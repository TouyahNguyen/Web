<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 Tạo QR Code - Gửi Yêu Thương</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    :root {
      --pink-200: #ffccd5;
      --pink-300: #ffb3c1;
      --pink-400: #ff8fa3;
      --pink-500: #ff758f;
      --pink-600: #ff4d6d;
      --pink-700: #c9184a;
      --bg-start: #1a0a10;
      --bg-mid: #2d0a1e;
      --bg-end: #0d0208;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
      color: var(--pink-200);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 6vw, 3.5rem);
      background: linear-gradient(135deg, var(--pink-300), var(--pink-500), #ffe066);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: grad 4s ease infinite;
      margin-bottom: 0.5rem;
    }

    @keyframes grad {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .subtitle {
      color: var(--pink-400);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      opacity: 0.8;
    }

    .generator-card {
      background: linear-gradient(135deg, rgba(255,77,109,0.1), rgba(183,110,121,0.08));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,143,163,0.2);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 0 40px rgba(255,77,109,0.1);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--pink-300);
      font-size: 0.9rem;
    }

    input[type="text"], input[type="url"], input[type="color"], select {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: 1px solid rgba(255,143,163,0.25);
      background: rgba(255,77,109,0.08);
      color: var(--pink-200);
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--pink-500);
      box-shadow: 0 0 15px rgba(255,77,109,0.2);
    }

    input::placeholder { color: rgba(255,204,213,0.4); }

    .color-row {
      display: flex;
      gap: 1rem;
    }

    .color-row .form-group { flex: 1; }

    input[type="color"] {
      height: 48px;
      padding: 4px;
      cursor: pointer;
    }

    .btn-generate {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, var(--pink-600), var(--pink-700));
      color: white;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(255,77,109,0.4);
      margin-top: 0.5rem;
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255,77,109,0.5);
    }

    .btn-generate:active {
      transform: translateY(0);
    }

    /* QR Display */
    .qr-result {
      margin-top: 2rem;
      text-align: center;
      display: none;
    }

    .qr-result.show { display: block; animation: fadeUp 0.6s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .qr-wrapper {
      display: inline-block;
      padding: 1.5rem;
      background: white;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(255,77,109,0.2);
      position: relative;
    }

    .qr-wrapper canvas, .qr-wrapper img {
      display: block;
      max-width: 100%;
    }

    .qr-label {
      font-family: 'Dancing Script', cursive;
      font-size: 1.1rem;
      color: var(--pink-700);
      margin-top: 0.5rem;
      text-align: center;
    }

    .btn-download {
      margin-top: 1.5rem;
      padding: 0.8rem 2rem;
      border: 1px solid rgba(255,143,163,0.3);
      border-radius: 50px;
      background: rgba(255,77,109,0.12);
      color: var(--pink-300);
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .btn-download:hover {
      background: rgba(255,77,109,0.25);
      transform: translateY(-2px);
    }

    .tip {
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(255,77,109,0.06);
      border: 1px solid rgba(255,143,163,0.12);
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--pink-400);
      line-height: 1.6;
    }

    .tip strong { color: var(--pink-300); }

    .back-link {
      margin-top: 2rem;
      display: inline-block;
      color: var(--pink-400);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }

    .back-link:hover { color: var(--pink-300); }

    @media (max-width: 500px) {
      .generator-card { padding: 1.5rem 1.2rem; border-radius: 20px; }
      .color-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>
  <h1>🎨 Tạo QR Code</h1>
  <p class="subtitle">Tùy chỉnh mã QR dẫn đến trang yêu thương</p>

  <div class="generator-card">
    <div class="form-group">
      <label for="qr-url">🔗 URL trang web (dán link sau khi deploy)</label>
      <input type="url" id="qr-url" placeholder="https://your-love-page.vercel.app" value="">
    </div>

    <div class="form-group">
      <label for="qr-label">💌 Chữ hiện dưới QR Code</label>
      <input type="text" id="qr-label" placeholder="Quét để nhận yêu thương 💕" value="Quét để nhận yêu thương 💕">
    </div>

    <div class="color-row">
      <div class="form-group">
        <label for="qr-fg">🎨 Màu QR Code</label>
        <input type="color" id="qr-fg" value="#c9184a">
      </div>
      <div class="form-group">
        <label for="qr-bg">🖼️ Màu nền</label>
        <input type="color" id="qr-bg" value="#fff0f3">
      </div>
    </div>

    <div class="form-group">
      <label for="qr-size">📐 Kích thước</label>
      <select id="qr-size">
        <option value="6">Nhỏ (200px)</option>
        <option value="8" selected>Vừa (280px)</option>
        <option value="10">Lớn (360px)</option>
        <option value="14">Rất lớn (500px)</option>
      </select>
    </div>

    <button class="btn-generate" id="btn-generate" onclick="generateQR()">💕 Tạo QR Code</button>

    <div class="qr-result" id="qr-result">
      <div class="qr-wrapper" id="qr-wrapper">
        <div id="qr-output"></div>
        <p class="qr-label" id="qr-label-text"></p>
      </div>
      <br>
      <button class="btn-download" onclick="downloadQR()">📥 Tải QR Code</button>
    </div>

    <div class="tip">
      <strong>💡 Hướng dẫn:</strong><br>
      1. Deploy trang <code>index.html</code> lên hosting (Vercel, Netlify, GitHub Pages...)<br>
      2. Dán URL vào ô trên và tạo QR Code<br>
      3. In hoặc chia sẻ QR để người nhận quét bằng điện thoại
    </div>
  </div>

  <a href="index.html" class="back-link">← Quay lại trang yêu thương</a>

  <script>
    function generateQR() {
      const url = document.getElementById('qr-url').value.trim();
      if (!url) {
        // If no URL, use current page's index.html
        const base = window.location.href.replace(/[^/]*$/, '') + 'index.html';
        document.getElementById('qr-url').value = base;
        return generateQR();
      }

      const fg = document.getElementById('qr-fg').value;
      const bg = document.getElementById('qr-bg').value;
      const cellSize = parseInt(document.getElementById('qr-size').value);
      const label = document.getElementById('qr-label').value;

      // Generate QR
      const qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();

      const moduleCount = qr.getModuleCount();
      const size = moduleCount * cellSize + cellSize * 4; // padding
      const canvas = document.createElement('canvas');
      const labelHeight = label ? 40 : 0;
      canvas.width = size;
      canvas.height = size + labelHeight;
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = bg;
      ctx.beginPath();
      roundRect(ctx, 0, 0, canvas.width, canvas.height, 16);
      ctx.fill();

      // Draw modules
      const offset = cellSize * 2;
      for (let row = 0; row < moduleCount; row++) {
        for (let col = 0; col < moduleCount; col++) {
          if (qr.isDark(row, col)) {
            ctx.fillStyle = fg;
            const x = col * cellSize + offset;
            const y = row * cellSize + offset;
            // Rounded modules for a premium look
            ctx.beginPath();
            roundRect(ctx, x + 0.5, y + 0.5, cellSize - 1, cellSize - 1, cellSize * 0.25);
            ctx.fill();
          }
        }
      }

      // Draw corner hearts
      drawCornerHeart(ctx, offset + cellSize * 3.5, offset + cellSize * 3.5, cellSize * 2.5, fg);
      drawCornerHeart(ctx, offset + (moduleCount - 3.5) * cellSize, offset + cellSize * 3.5, cellSize * 2.5, fg);
      drawCornerHeart(ctx, offset + cellSize * 3.5, offset + (moduleCount - 3.5) * cellSize, cellSize * 2.5, fg);

      // Label
      if (label) {
        ctx.fillStyle = fg;
        ctx.font = `600 ${Math.max(12, cellSize * 2)}px 'Quicksand', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(label, canvas.width / 2, size + labelHeight - 10);
      }

      // Display
      const output = document.getElementById('qr-output');
      output.innerHTML = '';
      output.appendChild(canvas);

      document.getElementById('qr-label-text').textContent = '';
      document.getElementById('qr-result').classList.add('show');
    }

    function roundRect(ctx, x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
    }

    function drawCornerHeart(ctx, cx, cy, size, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.12;
      ctx.beginPath();
      const s = size * 0.5;
      const dx = cx;
      const dy = cy;
      ctx.moveTo(dx, dy + s * 0.3);
      ctx.bezierCurveTo(dx, dy - s * 0.1, dx - s * 0.5, dy - s * 0.3, dx, dy - s * 0.55);
      ctx.bezierCurveTo(dx + s * 0.5, dy - s * 0.3, dx, dy - s * 0.1, dx, dy + s * 0.3);
      ctx.fill();
      ctx.restore();
    }

    function downloadQR() {
      const canvas = document.querySelector('#qr-output canvas');
      if (!canvas) return;

      const link = document.createElement('a');
      link.download = 'love-qr-code.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
